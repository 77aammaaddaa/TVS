        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=JetBrains+Mono:wght@400;600&display=swap');
        :root { --bg:#1A3323; --fg:#FCFCFC; --muted: rgba(252,252,252,0.55); }
        html { scroll-behavior: smooth; }
        body { font-family: 'Fraunces', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace !important; }

        @keyframes float {
          0%, 100% { transform: translateY(0px) rotate(0deg); }
          25% { transform: translateY(-6px) rotate(0.4deg); }
          50% { transform: translateY(-10px) rotate(-0.3deg); }
          75% { transform: translateY(-4px) rotate(0.2deg); }
        }
        .animate-float {
          animation: float 4.2s ease-in-out infinite;
          will-change: transform;
        }

        @keyframes drawLine {
          to { stroke-dashoffset: 0; }
        }

          stroke-dasharray: 1200;
          stroke-dashoffset: 1200;
        }
        .kleiv-doodle.animate-float path,
        .kleiv-doodle.animate-float circle,
        .kleiv-doodle.animate-float ellipse {
          /* keep visible during float */
          stroke-dashoffset: 0;
        }
        .draw-on-hover:hover path,
        .draw-on-hover:hover circle,
        .draw-on-hover:hover ellipse,
        .draw-on-hover.is-draw path,
        .draw-on-hover.is-draw circle,
        .draw-on-hover.is-draw ellipse {
          animation: drawLine 1.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        /* stagger inner elements */
        .draw-on-hover:hover .ice-cube-2 path { animation-delay: 0.08s; }
        .draw-on-hover:hover .ice-cube-3 path { animation-delay: 0.16s; }
        .draw-on-hover:hover .puddle-2 { animation-delay: 0.22s; }
        .draw-on-hover:hover .steam-2 { animation-delay: 0.1s; }
        .draw-on-hover:hover .steam-3 { animation-delay: 0.18s; }
        .draw-on-hover:hover .croissant-layer-2 { animation-delay: 0.12s; }

        /* for preview section that shows pure draw on hover without initial offset */
        .draw-only-demo .kleiv-doodle path,
        .draw-only-demo .kleiv-doodle circle,
        .draw-only-demo .kleiv-doodle ellipse {
          stroke-dasharray: 1200;
          stroke-dashoffset: 1200;
        }
        .draw-only-demo:hover .kleiv-doodle path,
        .draw-only-demo:hover .kleiv-doodle circle,
        .draw-only-demo:hover .kleiv-doodle ellipse {
          animation: drawLine 1.5s ease forwards;
        }
