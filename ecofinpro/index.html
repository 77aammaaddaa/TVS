<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="EcoFin Pro V15 - Enterprise ERP System" />
    <title>EcoFin Pro V15</title>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <!-- ✅ Splash Screen Frame -->
    <iframe 
      id="splash-frame" 
      src="/splash.html" 
      title="EcoFin Pro Splash"
      class="fixed inset-0 w-full h-full border-0 z-[99999] bg-slate-900"
      style="transition: opacity 0.5s ease, visibility 0.5s ease;"
    >
    </iframe>

    <div id="root"></div>

    <!-- ✅ Splash Control Script -->
    <script>
      window.EcoFineSplash = (function() {
        let introDone = false;
        let appDone = false;

        function tryHide() {
          const el = document.getElementById('splash-frame');
          if (!el) return;
          
          // إذا التطبيق جاهز أو اكتمل الانترو، أخفي الشاشة
          if (appDone || introDone) {
            el.style.opacity = '0';
            el.style.visibility = 'hidden';
            el.style.pointerEvents = 'none';
            document.body.classList.add('app-ready');
            
            setTimeout(() => {
              try { el.remove(); } catch(e) {}
            }, 600);
          }
        }

        // استدعيها بعد نجاح تهيئة التطبيق (في main.tsx أو app.js)
        window.markAppReady = function() {
          appDone = true;
          tryHide();
        };

        // السبلاش يختفي تلقائياً بعد 8 ثواني أو عند رسالة "done"
        setTimeout(() => { introDone = true; tryHide(); }, 8000);
        
        window.addEventListener('message', function(event) {
          if (event.data?.source === 'ecofine-splash' && event.data.type === 'done') {
            introDone = true;
            tryHide();
          }
        });

        return { markAppReady };
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
