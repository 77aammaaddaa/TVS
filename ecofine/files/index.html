            position: fixed; inset: 0;
            width: 100%; height: 100%;
            border: 0; z-index: 99999;
            background: #0D1B2A; /* matches the intro's own background so there's no white flash while it loads */
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #splash-frame.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 🖨️ إعدادات الطباعة السيادية */
        @media print {
            body * { visibility: hidden; }

<body class="antialiased overflow-hidden selection:bg-blue-500 selection:text-white">

    <iframe id="splash-frame" src="splash.html" title="Eco Fine Pro" aria-label="Loading Eco Fine Pro"></iframe>

    <div id="root"></div>

    <script>
      // واجهة مشتركة بين index.html و app.js للتحكم في شاشة الانترو - معرّفة هنا (سكريبت عادي، مش Babel)
      // عشان تكون جاهزة قبل ما أي كود Babel (بما فيه app.js) يحاول يستخدمها، Babel بيحمّل ويترجم الملفات
      // بشكل غير متزامن فبنضمن ترتيب التنفيذ الصح بوضعها هنا في الأول.
      //
      // - index.html مسؤول عن عنصر iframe نفسه وعن معرفة إن الانترو خلص (تخطي أو انتهى تلقائيًا).
      // - app.js هو الوحيد اللي يعرف إن التطبيق جاهز فعليًا (db.init نجح/فشل)، وهو اللي يستدعي markAppReady().
      // الشاشة متتخفيش غير لما الاتنين يكونوا جاهزين، عشان محدش يشوف الداشبورد وهو لسه بيحمل بياناته.
      window.EcoFineSplash = (function () {
        let introDone = false;
        let appDone = false;
        let hidden = false;

        function tryHide() {
          const el = document.getElementById('splash-frame');
          if (hidden || !el || !(introDone && appDone)) return;
          hidden = true;
          el.classList.add('is-hidden');
          document.body.classList.add('app-ready');
          setTimeout(() => el.remove(), 600);
        }

        // يستدعيها app.js بعد ما initializeApp() تخلص (نجاح، فشل، أو تايم آوت الـ 10 ثواني بتاعه)
        function markAppReady() {
          appDone = true;
          tryHide();
        }

        // splash.html يبعت الرسالة دي لما اليوزر يدوس "تخطي" أو لما أنيميشن الانترو تخلص لوحدها
        window.addEventListener('message', function (event) {
          if (event.data && event.data.source === 'ecofine-splash' && event.data.type === 'done') {
            introDone = true;
            tryHide();
          }
        });

        // شبكة أمان مطلقة: لو app.js نفسه فشل يحمل (خطأ في ملف قبله مثلاً)، الموقع ميفضلش واقف على الانترو للأبد
        setTimeout(function () { introDone = true; appDone = true; tryHide(); }, 12000);

        return { markAppReady };
      })();
    </script>
